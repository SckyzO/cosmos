minimum_pre_commit_version: '3.7.0'

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      # Staged changes only: guards local commits.
      - id: gitleaks
      # The whole history, for CI (pre-commit.yml): a CI checkout has nothing
      # staged, so the hook above scans nothing there.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in the git history
        entry: gitleaks git --redact --verbose
        stages: [manual]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint

  # Local hook so the image tag is pinned: upstream's hadolint-docker entry pulls
  # an untagged (latest) image whatever the rev, so a hadolint release adding a
  # rule broke every open PR at once. Bump the tag deliberately.
  - repo: local
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        language: docker_image
        types: [dockerfile]
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: ['-i', '2', '-ci', '-bn', '-w']

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        # CHANGELOGs (root + per-package) are generated by release-please in its
        # own style (dash bullets, blank-line spacing); don't lint them.
        args:
          - '--config'
          - '.markdownlint.yaml'
          - '--ignore'
          - 'CHANGELOG.md'
          - '--ignore'
          - '**/CHANGELOG.md'

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - chore
          - docs
          - refactor
          - perf
          - test
          - build
          - ci
          - style
          - revert
