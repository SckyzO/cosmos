title = "Cosmos gitleaks configuration"

# Extend the built-in ruleset. Do NOT drop this: without useDefault the file
# would REPLACE the default rules and disable all secret detection.
[extend]
useDefault = true

# The generic-api-key rule flags high-entropy keyboard-shortcut strings in the
# HelpOverlay stories (e.g. keys="shift+arrowdown"). These are demo props, not
# secrets. Keep the exception tight: only that file, only that rule, only lines
# that declare a shortcut, so a real secret in the same file still trips.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "HelpOverlay keyboard-shortcut demos are not secrets"
condition = "AND"
paths = ['''packages/react/src/ui/HelpOverlay\.stories\.tsx''']
regexTarget = "line"
regexes = ['''keys="[^"]*"''']


# The SecretValue stories need values that look like an API key and a webhook
# secret: they are made up for the demo. Same tight scope: that file, that
# rule, only the two constants that hold them. Written as an allowlist of the
# rule itself, the form gitleaks 8.21 (the pinned hook) reads: it keeps the
# default rule's regex and adds this exception to it.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "SecretValue demo values are not secrets"
condition = "AND"
paths = ['''packages/react/src/ui/SecretValue\.stories\.tsx''']
regexTarget = "line"
regexes = ['''const (API_KEY|WEBHOOK) = '[^']*';''']
