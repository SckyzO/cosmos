# Runs the full pre-commit suite in CI. The hooks are declared in
# .pre-commit-config.yaml but never ran anywhere: pre-commit is not installed on
# the host (container-first) and no other workflow invoked it, so gitleaks,
# actionlint, hadolint, shellcheck, shfmt and the rest were dead. This is the one
# enforcement point that survives the "nothing on the host" rule.
name: pre-commit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run all hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks-history scans every commit
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit
      # commit-msg-stage hooks (conventional-pre-commit) are skipped by
      # --all-files; they gate real commits, not a bulk file scan.
      - name: Run hooks
        run: pre-commit run --all-files --show-diff-on-failure --color=always
      # The gitleaks hook above scans staged changes, and a CI checkout has
      # none: scan the history instead, the PR's commits included.
      - name: Scan the git history for secrets
        run: pre-commit run --hook-stage manual gitleaks-history --all-files --color=always
