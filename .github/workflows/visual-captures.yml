name: Visual captures

# Every story in every theme, captured once a month and on demand, for a visual
# review of the whole catalogue (#134). The PNGs are uploaded as an artifact,
# and a full run is compared with the previous full run: the captures that
# changed are listed in the run summary and in one review issue. Nothing is
# asserted, and this is never a required check.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      stories:
        description: Story id substrings, comma-separated (empty for every story)
        required: false
        default: ''
      themes:
        description: Themes, comma-separated (empty for every theme)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  captures:
    name: Capture every story
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # The version comes from `packageManager` in package.json (see ci.yml).
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Install Playwright browsers
        run: pnpm --filter @cosmos/e2e exec playwright install --with-deps chromium

      # With CI set, Playwright serves storybook-static, as in ci.yml.
      - name: Capture
        env:
          STORIES: ${{ inputs.stories }}
          THEMES: ${{ inputs.themes }}
        run: pnpm --filter @cosmos/e2e screenshots

      # Only a complete run of every story and theme is next month's baseline.
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ job.status == 'success' && inputs.stories == '' && inputs.themes == '' && 'story-captures' || 'story-captures-partial' }}
          path: screenshots/
          retention-days: 90
          if-no-files-found: error

  report:
    name: Report changes since the last full capture
    needs: captures
    # A filtered run has nothing to match in the baseline.
    if: inputs.stories == '' && inputs.themes == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Kept out of the capture job, which runs the dependencies' code.
    permissions:
      contents: read
      actions: read # find and download the previous full capture
      issues: write # open or update the review issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download these captures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: story-captures
          path: current

      # The baseline comes only from this workflow's own runs on main, which only
      # the schedule and maintainers (workflow_dispatch) can start. An artifact
      # name alone proves nothing: any run, a fork's pull request included, can
      # upload a `story-captures` artifact.
      - name: Download the previous full capture
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          runs=$(gh run list --workflow visual-captures.yml --branch "$DEFAULT_BRANCH" \
            --status success --limit 30 --json databaseId,event \
            --jq ".[] | select(.event == \"schedule\" or .event == \"workflow_dispatch\")
                      | select(.databaseId != $RUN_ID) | .databaseId")
          # The latest one with a complete capture (a filtered run has none).
          for run in $runs; do
            if gh run download "$run" --name story-captures --dir previous 2>/dev/null; then
              echo "run=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'No previous full capture to compare with.' >> "$GITHUB_STEP_SUMMARY"

      - name: Compare
        if: steps.previous.outputs.run
        run: |
          command -v compare >/dev/null || {
            sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends imagemagick
          }
          .github/scripts/visual-diff.sh previous current visual-diff
          cat visual-diff/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the changed captures
        if: steps.previous.outputs.run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: story-changes
          path: visual-diff/
          retention-days: 90

      - name: Open or update the review issue
        if: steps.previous.outputs.run
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Visual review: story changes since the last capture'
          changed=$(wc -l < visual-diff/changed.txt)
          new=$(wc -l < visual-diff/new.txt)
          removed=$(wc -l < visual-diff/removed.txt)
          {
            echo "Captures of [this run]($RUN_URL) compared with run $PREVIOUS."
            echo "Before, after and diff images are in the run's \`story-changes\` artifact."
            echo
            cat visual-diff/report.md
          } > body.md
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          elif [ $((changed + new + removed)) -gt 0 ]; then
            gh issue create --title "$title" --body-file body.md
          fi
