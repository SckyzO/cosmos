# Automatic Claude review, posted as inline PR comments.
#
# Runs once when a PR is opened or marked ready, not on every push: each run
# draws on the maintainer's Claude subscription. Ask for a re-review with
# `@claude review` (claude.yml). Dependabot PRs are skipped: they don't get
# Actions secrets, and dependency bumps aren't what this review is for.
# Drafts are skipped until they're marked ready.
name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.user.login != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

      # The plugin's first step may decide a PR needs no review and stop
      # without posting anything, and the job still passes. Fail instead, so a
      # green check always means a review was posted; re-run with
      # `@claude review`.
      - name: Fail when no review was posted
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          posted=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "claude[bot]")] | length')
          inline=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "claude[bot]")] | length')
          if [ "$posted" -eq 0 ] && [ "$inline" -eq 0 ]; then
            echo "::error::The review skipped this PR without posting a comment. Comment '@claude review' to run it."
            exit 1
          fi
