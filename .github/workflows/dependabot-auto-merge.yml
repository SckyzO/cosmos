# Auto-merge Dependabot minor and patch updates once the required checks pass.
# Major bumps are left open for a human to review, since they can break. The
# groups in dependabot.yml are already minor+patch only, so a major always
# arrives as its own ungrouped PR and stays manual.
#
# A rebase can retarget an open PR to a newer release: #120 went from
# apexcharts 6.7.0 to 8.3.1, and the auto-merge armed for the minor merged the
# major unreviewed. The workflow re-runs on every push to the PR, so it now
# disarms auto-merge whenever the update is no longer minor or patch.
#
# npm only, and only when the package kept its maintainers: GitHub Actions and
# Docker bumps change code that runs in publish.yml next to the npm OIDC
# token, and a new maintainer is how a hijacked package shows up. Those always
# get a human review.
name: dependabot-auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # The PR must be Dependabot's own, and Dependabot must have triggered this run.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for minor and patch npm updates
        if: >-
          ${{ steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
          && steps.meta.outputs.maintainer-changes != 'true'
          && (steps.meta.outputs.update-type == 'version-update:semver-minor'
          || steps.meta.outputs.update-type == 'version-update:semver-patch') }}
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # always(): if fetch-metadata fails, its outputs are empty and an auto-merge
      # armed by an earlier run must still be disarmed.
      - name: Disable auto-merge for anything else
        if: >-
          ${{ always() && !(steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
          && steps.meta.outputs.maintainer-changes != 'true'
          && (steps.meta.outputs.update-type == 'version-update:semver-minor'
          || steps.meta.outputs.update-type == 'version-update:semver-patch')) }}
        run: |
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
