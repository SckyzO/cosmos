name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        # No `version:` here — `packageManager: pnpm@X.Y.Z` in package.json
        # is the single source of truth. Setting both produces:
        #   Error: Multiple versions of pnpm specified
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm storybook:build

      # `pnpm test` is recursive across workspaces and `tests/e2e`'s test
      # script invokes Playwright, so the browsers have to exist before we
      # run it. Installing here covers both `Unit tests` (which actually
      # contains the e2e suite via `pnpm -r test`) and downstream needs.
      # Chromium only: it is the sole Playwright project and the engine the
      # Vitest browser runner uses. Each package installs the revision its own
      # Playwright pins: tests/e2e (`@playwright/test`) and apps/storybook
      # (`playwright`, Vitest's provider). A patch bump can change the revision,
      # and installing from e2e alone left Vitest unable to launch. Dependabot
      # groups the two, so the second install is normally a no-op.
      - name: Install Playwright browsers
        run: |
          pnpm --filter @cosmos/e2e exec playwright install --with-deps chromium
          pnpm --filter @cosmos/storybook exec playwright install chromium

      - name: Unit + E2E tests
        run: pnpm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
