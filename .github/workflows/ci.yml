name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `changes` lists what the change touches. When it is documentation only, the five
# jobs after it are skipped; otherwise they run side by side (`contrast` once per
# theme). Then `ci` checks they all passed (or were skipped for a docs-only change). `make ci` runs the same commands one after the other in the dev
# container. Each job builds what it tests: no artifact passes between jobs, so
# none can be swapped.
#
# The jobs that open a browser run in Playwright's image, pinned by digest like
# the actions. It holds Chromium's system libraries, the ones the dev image gets
# from `playwright install-deps` at the same version, so no job runs apt:
# `install --with-deps` did, and a slow Ubuntu mirror made it take 10 to 13
# minutes on some runs, past the 15-minute timeout. `--user 1001` is the
# runner's user, who owns the workspace and the caches.
#
# The skip is decided by a job and not by `paths-ignore` on the workflow: a workflow
# that does not run leaves the required check missing, and the PR waits for it.
jobs:
  changes:
    # `code` is false only for a pull request that changes Markdown, docs/ and pictures
    # (tests/e2e/checks/docs-only.sh, the rule `make check-changed` applies too). A push
    # to main always runs everything. When this job fails, `code` is not set and `ci` fails.
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # The whole history: the diff needs the base and the head of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List the changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            # --no-renames: a file renamed from code to Markdown lists both names.
            files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
            echo "$files"
            if printf '%s\n' "$files" | tests/e2e/checks/docs-only.sh; then
              code=false
            fi
          fi
          echo "Anything beyond documentation changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  static:
    name: Lint + format + typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # No `version:` here — `packageManager: pnpm@X.Y.Z` in package.json
        # is the single source of truth. Setting both produces:
        #   Error: Multiple versions of pnpm specified
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Theme contrast and metadata
        run: pnpm --filter @sckyzo/cosmos-theme test

  build-e2e:
    name: Build + e2e
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm storybook:build

      # Chromium only: the sole Playwright project. tests/e2e installs the
      # revision its own `@playwright/test` pins; nothing to download while it
      # is the image's.
      - name: Install Playwright browsers
        run: pnpm --filter @cosmos/e2e exec playwright install chromium

      # With CI set, Playwright serves storybook-static: the dev server compiles
      # pages on first visit and its dep optimizer reloads mid-test. The dist
      # specs read the packages built above.
      - name: E2E tests
        run: pnpm --filter @cosmos/e2e test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  stories:
    name: Unit + story tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vitest's browser provider is apps/storybook's `playwright`, which pins
      # its own revision (a patch bump of one package can change it).
      - name: Install Playwright browsers
        run: pnpm --filter @cosmos/storybook exec playwright install chromium

      # Both Vitest projects: the `node` unit tests and the stories in Chromium,
      # axe included. They compile the packages from source: no build needed.
      - name: Unit and story tests
        run: pnpm --filter @cosmos/storybook test

  contrast:
    # `stories` runs axe in the default theme (dark). This pass renders every
    # story in another theme and runs axe's color-contrast rule alone, with no
    # todo list.
    name: Story contrast (${{ matrix.theme }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    strategy:
      # Report every theme, not only the first one that fails.
      fail-fast: false
      matrix:
        theme: [light, sand, deep-blue]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @cosmos/storybook exec playwright install chromium

      - name: Story contrast pass
        env:
          A11Y_THEME: ${{ matrix.theme }}
        run: pnpm --filter @cosmos/storybook a11y:contrast

  direction:
    # `stories` renders every story left to right. This pass renders each one again
    # under `dir="rtl"` on `<html>`, with every axe rule and the play functions, and
    # fails a story that scrolls sideways in right to left and not in left to right.
    name: Story tests (right to left)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @cosmos/storybook exec playwright install chromium

      - name: Story direction pass
        run: pnpm --filter @cosmos/storybook a11y:rtl

  ci:
    # Branch protection requires this check name: keep it.
    name: Lint + typecheck + test + build
    needs: [changes, static, build-e2e, stories, contrast, direction]
    # Runs when a job fails or is cancelled too, so the check never stays
    # pending, and fails then.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # `changes` must have succeeded. The other jobs must have succeeded, or been
      # skipped when `changes` found documentation only: no other result passes.
      - name: Require every job to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "The job that lists the changed files ended with: $CHANGES"
            exit 1
          fi
          allowed=success
          if [ "$CODE" = false ]; then
            allowed='success skipped'
          fi
          for result in $RESULTS; do
            case " $allowed " in
              *" $result "*) ;;
              *)
                echo "A required job ended with: $result"
                exit 1
                ;;
            esac
          done
