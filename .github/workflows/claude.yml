# On-demand Claude Code agent: mention @claude in an issue, a PR comment or a
# review and it answers (except `@claude review` on a PR: claude-code-review.yml), or implements the request on a branch and opens a PR.
#
# Auth is the maintainer's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN, made by
# `/install-github-app`), so every run draws on that plan's usage limits.
# The action only obeys users with write access and ignores bots by default;
# the job `if` filters on author_association too, so a stranger's mention
# never starts a runner.
# use_commit_signing makes its commits through the GitHub API, which signs
# them: main requires signed commits, so an agent PR is otherwise unmergeable.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !startsWith(github.event.comment.body, '@claude review') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          # Code changes get high effort; the model default (medium on
          # Opus/Sonnet 5.5) is fine for answers but thin for edits. Higher
          # effort draws more of the subscription per run.
          claude_args: --effort high
          additional_permissions: |
            actions: read
