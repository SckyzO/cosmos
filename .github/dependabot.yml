version: 2
# Monthly (1st of the month) for every ecosystem: a weekly cadence opened a
# stream of PRs that each replayed CI and conflicted on pnpm-lock.yaml. The
# schedule only drives version updates; security updates still open as soon
# as an advisory lands.
#
# Version updates also wait 3 days after a release (cooldown), longer than
# pnpm's minimumReleaseAge (pnpm-workspace.yaml), so Dependabot never proposes
# a version pnpm refuses. Security updates don't wait.
updates:
  # ---------------------------------------------------------------------------
  # npm via pnpm — root + all workspaces
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: 'scope'
    groups:
      react:
        patterns:
          - 'react*'
          - '@types/react*'
        update-types:
          - 'minor'
          - 'patch'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
        update-types:
          - 'minor'
          - 'patch'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'prettier-plugin-tailwindcss'
        update-types:
          - 'minor'
          - 'patch'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'vitest'
        update-types:
          - 'minor'
          - 'patch'
      typescript:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - 'tsup'
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'
      lint:
        patterns:
          - 'eslint*'
          - 'prettier'
          - '@typescript-eslint/*'
          - 'stylelint*'
        update-types:
          - 'minor'
          - 'patch'
      # `playwright` (Vitest's browser provider, apps/storybook) and
      # `@playwright/test` (tests/e2e) must resolve the same version: CI installs
      # one browser revision for both, and a patch bump can change it.
      playwright:
        patterns:
          - '@playwright/*'
          - 'playwright'
        update-types:
          - 'minor'
          - 'patch'

  # ---------------------------------------------------------------------------
  # GitHub Actions — pin by SHA, monthly bumps
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - 'actions/*'
          - 'github/*'
        update-types:
          - 'minor'
          - 'patch'

  # ---------------------------------------------------------------------------
  # Docker (Dockerfile.dev base image)
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'docker'
    directory: '/config/docker'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    commit-message:
      prefix: 'chore(docker)'
      include: 'scope'
